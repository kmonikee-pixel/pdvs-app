<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PDVs Seda de Favela</title>
<meta name="theme-color" content="#c63d1d">
<meta name="description" content="Pontos de venda, reposição, pedidos e bonificação da Seda de Favela.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PDVs SDF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: caderno de rota de quem vende na rua; direto, sem enfeite.
   IDEA: a prancheta do vendedor: quem repor hoje, quem tá esfriando, quem é coroa.
   PICTURE: faixa de tijolo com o morro em blocos e os números grandes; abaixo, o quadro de reposição.
   COLOUR and TYPE: tijolo #c63d1d dominante, tinta quase preta, amarelo-sol só para bônus e urgência; Barlow Condensed + Barlow.
   LAYOUT: no celular, barra de abas embaixo e botão + sempre à mão do polegar; no computador, abas no topo. */
:root{color-scheme:light dark;
--bg:light-dark(#f4f1ec,#13110f);--card:light-dark(#fff,#1d1a17);--ink:light-dark(#1a1714,#f2ede6);
--mute:light-dark(#6d655c,#a89f94);--line:light-dark(#e2dcd3,#342f2a);--brick:light-dark(#c63d1d,#b83a1c);
--sun:#ffc93c;--sunInk:#2a1d00;--ok:light-dark(#1f6b4a,#5fcf9a);--soft:light-dark(#f8f6f2,#191613);
--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.num{font-family:"Barlow Condensed",Barlow,sans-serif;line-height:1.05;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.ro [data-w],.ro .fab,.ro .acts .btn,.notadm [data-adm]{display:none!important}
.top{background:var(--brick);color:#fff;position:relative;overflow:hidden;padding:calc(18px + var(--safeT)) max(4vw,16px) 22px}
.sky{position:absolute;right:0;bottom:0;width:min(560px,70%);height:150px;opacity:.22;pointer-events:none}
.row1{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;position:relative}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:48px;height:48px;border-radius:12px;flex:none}
.top h1{font-size:clamp(28px,5vw,46px);font-weight:800}
.top p{margin:2px 0 0;opacity:.88;font-size:14px}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.who{font-size:13px;opacity:.9;display:flex;gap:8px;align-items:center}
.who button{background:#00000030;border:0;color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;min-height:34px}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:2px solid transparent;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,tr:focus-visible,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.sun{background:var(--sun);color:var(--sunInk)}
.ghost{background:transparent;border-color:#ffffffaa;color:#fff}
.ink{background:var(--ink);color:var(--bg)}
.line{background:var(--card);border-color:var(--line);color:var(--ink)}
.sm{min-height:40px;padding:0 12px;font-size:14px;border-radius:8px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:20px;position:relative}
.kpi{background:#00000026;border-radius:12px;padding:12px 14px}
.kpi .num{font-size:clamp(28px,4.4vw,44px);font-weight:800;display:block}
.kpi small{font-size:13px;opacity:.9;display:block}
.kpi.hot{background:var(--sun);color:var(--sunInk)}
button.kpi{border:0;text-align:left;color:inherit;cursor:pointer;font:inherit}
.net{display:none;padding:9px max(4vw,16px);font-weight:600;font-size:14px;background:var(--ink);color:var(--bg)}
.net.on{display:flex;gap:8px;align-items:center}
.net i{width:10px;height:10px;border-radius:50%;background:var(--sun);flex:none}
.tabs{display:flex;gap:4px;padding:0 max(4vw,16px);background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;overflow-x:auto}
.tabs a{flex:none;padding:14px 14px 12px;color:var(--mute);text-decoration:none;font-weight:700;border-bottom:3px solid transparent;display:flex;gap:6px;align-items:center}
.tabs a.on{color:var(--ink);border-color:var(--brick)}
.tabs a b{background:var(--brick);color:#fff;border-radius:99px;padding:0 7px;font-size:12px}
.tabs svg{width:22px;height:22px;display:none}
.tabs .mob{display:none}
.fab{display:none}
main{padding:24px max(4vw,16px) 80px;max-width:1280px;margin:0 auto}
h2{font-size:clamp(26px,3.4vw,34px);font-weight:800;margin-bottom:6px}
h3{font-size:21px;font-weight:700;margin:26px 0 10px;display:flex;gap:8px;align-items:baseline}
h3 span{font:500 14px Barlow;color:var(--mute)}
.lead{color:var(--mute);margin:0 0 18px;max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card.late{border-color:var(--brick);box-shadow:inset 4px 0 0 var(--brick)}
.ct{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nm{font-weight:700;font-size:17px;line-height:1.25;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.pl{color:var(--mute);font-size:14px}
.due{text-align:right;flex:none}
.due .num{font-size:28px;font-weight:800;display:block;white-space:nowrap}
.due small{font-size:12px;color:var(--mute);white-space:nowrap}
.late .due .num{color:var(--brick)}
.meta{font-size:14px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 12px}
.meta b{color:var(--ink);font-weight:600}
.cb{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--soft);border:1px solid var(--line)}
.p-ativo{background:light-dark(#e3f3ea,#163527);color:var(--ok);border-color:transparent}
.p-prospeccao{background:light-dark(#fff3cf,#3a2f0f);color:light-dark(#7a5600,#ffd772);border-color:transparent}
.p-inativo{color:var(--mute)}
.p-verificar{background:light-dark(#fde5dd,#3b1d14);color:var(--brick);border-color:transparent}
.p-fechou{text-decoration:line-through;color:var(--mute)}
.pend{background:var(--sun);color:var(--sunInk);border-color:transparent}
.tier{font-family:"Barlow Condensed";font-weight:800;font-size:13px;letter-spacing:.3px;padding:1px 8px;border-radius:6px;background:var(--ink);color:var(--bg);white-space:nowrap}
.t3{background:var(--sun);color:var(--sunInk)}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:22px;color:var(--mute)}
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:center}
.hero .num{font-size:clamp(52px,8vw,84px);font-weight:800;color:var(--brick)}
.steps{margin:0;padding-left:20px}.steps li{margin:4px 0}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bar input,.bar select,.f input,.f select,.f textarea{min-height:48px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:16px;width:100%}
.bar input{flex:1 1 220px}.bar select{flex:1 1 150px;width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
th{font-size:13px;color:var(--mute);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--soft)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px}
tbody tr[data-act]{cursor:pointer}tbody tr:hover{background:var(--soft)}
td.r,th.r{text-align:right;white-space:nowrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.rk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.rk h3{margin-top:0}
.rr{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:6px 0;cursor:pointer}
.rr i{font-style:normal;color:var(--mute);font-weight:700;font-size:14px}
.rr .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.rr .v{font-weight:700;white-space:nowrap;text-align:right}
.rr .tr{grid-column:2/4;height:7px;background:var(--soft);border-radius:9px;overflow:hidden}
.rr .tr div{height:100%;background:var(--brick);border-radius:9px}
.tiers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:8px}
.tc{border-radius:14px;padding:16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.tc .num{font-size:30px;font-weight:800}
.tc.top3{background:var(--sun);color:var(--sunInk);border-color:var(--sun)}
.tc .q{font-size:14px;opacity:.8}
.prog{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;width:110px;display:inline-block;vertical-align:middle;margin-right:6px}
.prog div{height:100%;background:var(--sun)}
.tri{max-width:640px;margin:0 auto}
.tri .card{padding:22px;gap:12px}
.tri .nm{font-size:clamp(26px,4vw,34px);font-family:"Barlow Condensed";font-weight:800;cursor:default}
.tb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tb .btn{min-height:56px;font-size:17px;white-space:normal;text-align:center;line-height:1.15}
.ok{background:var(--ok);color:#fff}
.flag{background:light-dark(#fff3cf,#3a2f0f);color:light-dark(#6b4c00,#ffd772);border-radius:10px;padding:8px 12px;font-size:14px}
.meter{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 4px}.meter div{height:100%;background:var(--brick)}
dialog{border:0;border-radius:18px;padding:0;width:min(640px,calc(100% - 20px));max-height:calc(100dvh - 30px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px #0006}
dialog::backdrop{background:#0008}
.dh{padding:18px 20px 6px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;position:sticky;top:0;background:var(--card);z-index:1}
.dh h2{font-size:28px}
.db{padding:6px 20px 24px}
.x{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:22px;flex:none}
.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
.f .w{grid-column:1/-1}
.f small{font-weight:400;color:var(--mute)}
.fa{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.fa .del{margin-right:auto;background:transparent;color:var(--brick);border-color:var(--brick)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:46px;border:0;border-radius:9px;background:transparent;font-weight:700;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.step{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:6px}
.step button{min-height:56px;border-radius:10px;border:1px solid var(--line);background:var(--soft);font-size:26px;font-weight:700;cursor:pointer}
.step input{text-align:center;font:800 26px "Barlow Condensed"!important;min-height:56px!important}
.pick{display:flex;flex-direction:column;gap:6px;margin-top:6px;max-height:300px;overflow:auto}
.pick button{text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--soft);cursor:pointer}
.pick button small{display:block;color:var(--mute)}
.chosen{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--soft);border:2px solid var(--ink);border-radius:12px;padding:10px 12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.stats div{background:var(--soft);border-radius:10px;padding:10px}
.stats .num{font-size:26px;font-weight:800;display:block}
.stats small{color:var(--mute);font-size:12px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;flex-wrap:wrap}
.lk{background:none;border:0;color:var(--brick);font-weight:600;cursor:pointer;padding:4px 6px;min-height:40px}
#toast{position:fixed;left:50%;bottom:calc(20px + var(--safeB));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;display:none;gap:12px;align-items:center;z-index:60;max-width:calc(100% - 24px);box-shadow:0 8px 30px #0005}
#toast button{background:var(--sun);color:var(--sunInk);border:0;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer;min-height:36px}
.menu{display:grid;gap:8px;max-width:520px}
.menu a,.menu button{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-height:56px;text-decoration:none;color:var(--ink);font-weight:700;cursor:pointer;width:100%;text-align:left}
.menu span{color:var(--mute);font-weight:500;font-size:14px}
/* login */
.gate{min-height:100dvh;background:var(--brick);color:#fff;display:grid;place-items:center;padding:calc(24px + var(--safeT)) 20px calc(24px + var(--safeB))}
.gate .box{width:min(420px,100%);display:flex;flex-direction:column;gap:14px}
.gate img{width:min(240px,62vw);height:auto;align-self:center;filter:drop-shadow(0 10px 24px #0005)}
.gate h1{font-size:44px;font-weight:800}
.gate p{margin:0;opacity:.9}
.gate input{min-height:52px;border-radius:12px;border:0;padding:0 14px;font-size:17px;width:100%;background:#fff;color:#1a1714}
.gate .btn{min-height:54px;font-size:17px}
.gate .err{background:#00000040;border-radius:10px;padding:10px 12px;font-size:15px}
.gate .lnk{background:none;border:0;color:#fff;text-decoration:underline;cursor:pointer;padding:8px 0;align-self:flex-start}
pre,.scroll{overflow-x:auto}
@media(max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.tiers{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:minmax(0,1fr)}}
@media(max-width:760px){
 .top{padding:calc(12px + var(--safeT)) 16px 14px}.sky,.acts .btn,.top p{display:none}.logo{width:38px;height:38px;border-radius:10px}.top h1{font-size:26px}
 .kpis{display:flex;overflow-x:auto;gap:8px;margin:12px -16px 0;padding:0 16px;scroll-snap-type:x mandatory;scrollbar-width:none}.kpis::-webkit-scrollbar{display:none}
 .kpi{flex:0 0 auto;min-width:132px;padding:10px 12px;scroll-snap-align:start}.kpi .num{font-size:30px}
 .tabs{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:20;padding:0 0 var(--safeB);gap:0;border-bottom:0;border-top:1px solid var(--line);overflow:visible;justify-content:space-around}
 .tabs a{flex:1;flex-direction:column;gap:2px;padding:8px 2px 7px;font-size:11.5px;border-bottom:0;border-top:3px solid transparent;position:relative}
 .tabs a.on{border-color:var(--brick)}.tabs svg{display:block}.tabs .dsk{display:none}.tabs .mob{display:flex}
 .tabs a b{position:absolute;top:2px;left:calc(50% + 6px);font-size:10px;padding:0 5px}
 .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(76px + var(--safeB));width:64px;height:64px;border-radius:20px;background:var(--sun);color:var(--sunInk);border:0;font:800 34px/1 "Barlow Condensed";box-shadow:0 8px 24px #0004;z-index:21;cursor:pointer}
 main{padding:18px 16px calc(150px + var(--safeB))}
 #toast{bottom:calc(150px + var(--safeB))}
 dialog{width:100%;max-width:100%;height:100dvh;max-height:100dvh;border-radius:0;margin:0}
 .dh{padding-top:calc(14px + var(--safeT))}
 .f{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .card .cb .btn{flex:1}
 table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 12px;padding-inline-start:8.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute);font-size:12px}.stack td:empty{display:none}.stack td:first-child{padding-inline-start:12px;font-size:16px}.stack td:first-child::before{display:none}
}
@media(prefers-reduced-motion:no-preference){.card,.rk,.tc{animation:up .25s ease-out both}@keyframes up{from{opacity:0;transform:translateY(6px)}}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<section class="gate" id="gate">
  <div class="box">
    <img src="logo.png" alt="Seda de Favela">
    <h1>PDVs</h1>
    <p id="gateMsg">Carregando…</p>
    <form id="loginF" hidden>
      <div style="display:flex;flex-direction:column;gap:10px">
        <input name="email" type="email" autocomplete="username" placeholder="Seu e-mail" required aria-label="E-mail">
        <input name="senha" type="password" autocomplete="current-password" placeholder="Senha" required aria-label="Senha">
        <button class="btn sun">Entrar</button>
        <div class="err" id="loginErr" hidden></div>
        <button type="button" class="lnk" id="forgot">Esqueci minha senha</button>
      </div>
    </form>
    <button class="btn ghost" id="gateOut" hidden>Sair desta conta</button>
  </div>
</section>

<div id="app" hidden>
<header class="top">
  <svg class="sky" viewBox="0 0 560 150" preserveAspectRatio="xMaxYMax slice" aria-hidden="true" id="sky"></svg>
  <div class="row1">
    <div class="brand"><img class="logo" src="icon-192.png" alt=""><div><h1>Pontos de venda</h1><p id="sub"></p></div></div>
    <div class="acts"><button class="btn sun" data-act="newPed">+ Pedido ou visita</button><button class="btn ghost" data-act="newPdv">+ Ponto de venda</button><span class="who"><span id="whoName"></span><button data-act="logout">Sair</button></span></div>
  </div>
  <div class="kpis" id="kpis"></div>
</header>
<div class="net" id="net"><i></i><span id="netMsg"></span></div>
<nav class="tabs" id="tabs">
  <a href="#repor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Repor</a>
  <a href="#pontos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Pontos</a>
  <a href="#ranking" class="dsk">Ranking</a>
  <a href="#bonus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>Bônus</a>
  <a href="#triagem" class="dsk" data-tri>Triagem</a>
  <a href="#equipe" class="dsk" data-admin hidden>Equipe</a>
  <a href="#ajustes" class="dsk">Ajustes</a>
  <a href="#mais" class="mob"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Mais</a>
